actions:
  openapiHarvested: 0
  apisListed: 0
  apisYmlUpdated: true
  reason: |
    apis[] is intentionally empty. Three UK documents no public API, publishes
    no base URL, and offers no developer onboarding of any kind. Listing its
    CAMARA network APIs here would misrepresent third-party press coverage and
    aggregator catalogues as first-party Three UK documentation. The CAMARA and
    Open Gateway evidence is recorded in this review and referenced from the
    common[] block in apis.yml instead.
