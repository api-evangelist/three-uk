note: >-
  Three UK exposes no API-discovery documents at /.well-known/. Every RFC-defined
  discovery path probed (security.txt RFC 9116, openid-configuration, RFC 8414
  oauth-authorization-server, oauth-protected-resource, RFC 9727 api-catalog,
  ai-plugin.json) returns 404 on www.three.co.uk and on every sibling host. The
  only two documents Three UK actually serves under /.well-known/ are the mobile
  app-association files for its My3 iOS and Android apps — real, but consumer-app
  deep-link plumbing, not a developer surface. Recorded because the absence is
  the finding for this provider: there is no anonymous discovery path into any
  Three UK API, including the CAMARA network APIs it commercially launched
  through GSMA Open Gateway, which are reachable only inside a channel partner's
  platform.
