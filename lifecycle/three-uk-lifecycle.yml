summary: >-
  Three UK runs a network-service lifecycle, not an API lifecycle. It publishes a
  real, dated service-status surface (an "affected areas" page plus a coverage /
  network-status checker) and it has executed a real, dated technology sunset —
  the 3G switch-off, now complete, announced against the UK Government's
  2021 commitment that all public 2G and 3G networks close by 2033 at the latest.
  What it does not publish is any API versioning scheme, API deprecation policy,
  Sunset/Deprecation header support, developer SLA, or API changelog, because it
  publishes no API. Everything below is the operator's service lifecycle; nothing
  below is an API contract.
api_lifecycle:
  versioning: none published
  deprecation_policy: none published
  sunset_header: false
  sunset_header_note: >-
    RFC 8594 Sunset/Deprecation headers cannot be observed because no Three UK
    API endpoint is published. No `Deprecation` pointer is emitted in apis.yml:
    the 3G sunset below is a network-service retirement, not an API deprecation
    policy, and claiming it as one would misrepresent the provider.
  changelog: none published
  sla: >-
    No developer or API SLA is published. Consumer service commitments are
    carried by the Ofcom Code of Practice and the Customer Complaints Code, not
    by a developer agreement.
status_page: https://www.three.co.uk/support/network-and-coverage/affected-areas
status_page_note: >-
  "Affected areas" is Three UK's live service-status page — it maps and lists the
  areas currently affected by network work or faults, with downloadable postcode
  lists, and links out to "Check coverage and network status". It is the
  operator's public status surface; there is no separate status.three.co.uk (the
  hostname does not resolve to a service).
