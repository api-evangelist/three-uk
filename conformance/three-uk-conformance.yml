generated: '2026-07-25'
method: searched
source: >-
  CAMARA Project governance roster, CAMARA landscape, GSMA Open Gateway newsroom,
  Telefonica Open Gateway newsroom, and live probes of every Three UK host on
  2026-07-25
summary: >-
  Three UK conforms to the telecom sector's network-API standards at the
  ORGANISATIONAL layer — it is a named CAMARA participant and a GSMA Open Gateway
  member through CK Hutchison Group Telecom, with CAMARA KYC Age Verification and
  KYC Tenure commercially launched on 23 September 2025 on top of an already
  available SIM Swap API. It conforms to none of them at the PUBLICATION layer:
  no Three UK API base URL, no OpenAPI, no OIDC/CIBA discovery document, no error
  or pagination convention is published anywhere, so no wire-level conformance
  claim can be verified from a Three UK surface. Every entry below distinguishes
  "the operator implements it" from "the operator publishes it".
standards:
- id: camara
  name: CAMARA Project network APIs
  conforms: true
  layer: organisational
  evidence: >-
    camaraproject/Governance PARTICIPANTS.MD lists "Three UK | Jason Tesh", with
    four further named participants under "Hutchison"; parent CK Hutchison
    Holdings is catalogued in camaraproject/camara-landscape under
    "Operation / Operators".
  url: https://github.com/camaraproject/Governance/blob/main/PARTICIPANTS.MD
  publication_note: >-
    CAMARA specifications are published by the CAMARA Project on GitHub, never by
    Three UK. No Three UK-hosted CAMARA endpoint, spec, or sandbox exists.
- id: gsma-open-gateway
  name: GSMA Open Gateway
  conforms: true
  layer: organisational
  evidence: >-
    GSMA press release of 2025-09-23 names CK Hutchison Group Telecom (Three)
    alongside BT/EE, Virgin Media O2 and Vodafone Group commercially launching
    the KYC Age Verification and KYC Tenure APIs in the UK, with KYC Match
    committed; Telefonica's Open Gateway newsroom names Three as one of the four
    UK operators with SIM Swap already available.
  url: https://www.gsma.com/newsroom/press-release/uk-mobile-operators-launch-age-verification-and-anti-fraud-apis-through-gsma-open-gateway-initiative/
  publication_note: >-
    Participation is at group level. opengateway.three.co.uk and
    developers.opengateway.three.co.uk resolve only to a dangling wildcard whose
    certificate does not cover them; Three UK operates no Open Gateway portal.
- id: camara-sim-swap
  name: CAMARA SIM Swap API
  conforms: true
  layer: organisational
  status: available via channel partners
  evidence: Telefonica Open Gateway newsroom states the four UK operators, including Three, already have SIM Swap available
  callable_from_provider: false
