compliance_note: >-
  No trust centre, no named security certification (SOC 2, ISO 27001, PCI DSS),
  and no vulnerability-disclosure policy could be verified on any Three UK host
  on 2026-07-25 — trust.three.co.uk and security.three.co.uk fail TLS hostname
  validation, and /security, /compliance, /responsible-disclosure and
  /vulnerability-disclosure all 404. Three UK's published governance surface is
  regulatory rather than security-certification shaped: an Ofcom Code of Practice
  and a Customer Complaints Code at
  https://www.three.co.uk/terms-conditions/code-of-practice/code-of-practice .
  No `Compliance` pointer is emitted because no certification programme is
  published.
